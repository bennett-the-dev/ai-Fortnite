# Save as /etc/nginx/sites-available/gridstrike (or conf.d/gridstrike.conf), then link/enable it.
# Replace game.example.com with YOUR domain. This is a NEW file: it does not touch your other Nginx sites.
# Step 1 (before HTTPS exists) use only the port-80 block; Certbot will add the 443 block for you.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name game.example.com;

    # Rate-limit the auth endpoints at the edge too (backend also limits)
    location = /api/login    { limit_req zone=gs_auth burst=5 nodelay; proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }
    location = /api/register { limit_req zone=gs_auth burst=5 nodelay; proxy_pass http://127.0.0.1:3000; include /etc/nginx/proxy_params; }

    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # keep idle game sockets open
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 32k;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}

# Put this ONE line in the http {} block (e.g. /etc/nginx/conf.d/gridstrike-limits.conf):
#   limit_req_zone $binary_remote_addr zone=gs_auth:10m rate=10r/m;
